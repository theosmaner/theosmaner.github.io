<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script>
  // Yeşert (/yesert) ilan bağlantıları: GitHub Pages dinamik adresleri bilmez.
  // /yesert/makineler/<ilan> açılınca ilan sayfası şablonunu aynı adreste yükler; diğer adreslerde bu sayfa normal görünür.
  (function () {
    var m = location.pathname.match(/^\/yesert\/makineler\/([^\/]+)\/?$/);
    if (!m) return;
    document.documentElement.style.visibility = 'hidden';
    fetch('/yesert/makineler/%5Bid%5D.html')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) { document.open(); document.write(html); document.close(); })
      .catch(function () { document.documentElement.style.visibility = ''; });
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Osman Er</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070707;
    --card: #101010;
    --border: #1f1f1f;
    --text: #f5f5f5;
    --dim: #a1a1a1;
    --neon: #e4ff1a;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 560px; padding: 52px 44px; text-align: center;
    background: radial-gradient(500px 260px at 50% -20%, rgba(228, 255, 26, .09), transparent 60%), var(--card);
    border: 1px solid var(--border); border-radius: 26px;
  }
  .code { font-size: clamp(72px, 18vw, 120px); font-weight: 800; line-height: 1; letter-spacing: -.05em; }
  .code span { color: var(--neon); }
  h1 { margin-top: 16px; font-size: clamp(22px, 4vw, 28px); font-weight: 800; letter-spacing: -.02em; }
  p { margin-top: 10px; color: var(--dim); font-size: 16px; }
  a {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 32px;
    background: var(--neon); color: #000; font-weight: 600; font-size: 15.5px; text-decoration: none;
    padding: 14px 22px; border-radius: 999px;
    transition: transform .4s var(--ease), box-shadow .4s var(--ease);
  }
  a svg { width: 18px; height: 18px; }
  a:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(228, 255, 26, .6); }
  @media (max-width: 600px) { .card { padding: 40px 24px; } }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404<span>.</span></div>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığın sayfa şu anda mevcut değil.</p>
    <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Ana sayfaya dön</a>
  </main>
</body>
</html>
