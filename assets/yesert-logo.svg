<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-label="Yeşert logosu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A2439"/>
      <stop offset="1" stop-color="#3F0F1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4CC38A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4CC38A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="840" height="400" fill="url(#bg)"/>
  <rect width="840" height="400" fill="url(#glow)"/>

  <!-- simge (uygulamadaki logo ile aynı çizim) -->
  <g transform="translate(150 120) scale(1.6)">
    <rect width="100" height="100" rx="24" fill="url(#tile)"/>
    <path d="M0 74 Q50 58 100 74 L100 100 L0 100 Z" fill="#4CC38A" fill-opacity="0.16"/>
    <path d="M50 66 L14 100 M50 66 L38 100 M50 66 L62 100 M50 66 L86 100" stroke="#4CC38A" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 68 C50 56 50 48 50 38" stroke="#4CC38A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M50 54 C37 54 27 46 25 33 C38 33 48 40 50 54 Z" fill="#4CC38A"/>
    <path d="M50 45 C61 45 72 37 74 24 C61 24 52 31 50 45 Z" fill="#9BE3BF"/>
    <path d="M80 12 L82 18 L88 20 L82 22 L80 28 L78 22 L72 20 L78 18 Z" fill="#9BE3BF"/>
  </g>

  <!-- isim: yeş (yeşil) + ert (vişne) -->
  <text x="350" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" letter-spacing="-2">
    <tspan fill="#4CC38A" font-weight="800">yeş</tspan><tspan fill="#D27A92" font-weight="300">ert</tspan>
  </text>
  <text x="354" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#94A3B8">Çiftçinin çiftçiye destek ağı</text>
</svg>
