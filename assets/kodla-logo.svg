<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-label="Kodla logosu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1A06"/>
      <stop offset="1" stop-color="#1A0D04"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="840" height="400" fill="url(#bg)"/>
  <rect width="840" height="400" fill="url(#glow)"/>

  <!-- simge (uygulamadaki mikrodenetleyici logosu) -->
  <g transform="translate(150 120) scale(1.6)">
    <rect width="100" height="100" rx="24" fill="url(#tile)" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="2"/>
    <g stroke="#FF6B00" stroke-width="5" stroke-linecap="round">
      <path d="M38 14 V26 M62 14 V26 M38 74 V86 M62 74 V86 M14 38 H26 M14 62 H26 M74 38 H86 M74 62 H86"/>
    </g>
    <rect x="26" y="26" width="48" height="48" rx="8" fill="none" stroke="#FF6B00" stroke-width="5"/>
    <rect x="39" y="39" width="22" height="22" rx="4" fill="url(#core)"/>
  </g>

  <!-- isim -->
  <text x="350" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" letter-spacing="-2">
    <tspan fill="#E8ECF4" font-weight="800">kod</tspan><tspan fill="#FF6B00" font-weight="300">la</tspan>
  </text>
  <text x="354" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#94A3B8">Arduino'yu adım adım öğren</text>
</svg>
